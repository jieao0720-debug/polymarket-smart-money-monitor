services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: polymarket_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/polymarket_monitor
      ENABLE_LIVE_TRADING: "false"   # safety default — do not flip casually
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - path: ./.env
        required: false
    ports:
      - "8000:8000"

volumes:
  pgdata:
